[package]
name = "medl"
version = "0.1.0"
edition = "2021"
description = "Resolve .medl configuration files: merge, check and resolve to JSON"
homepage = "https://medl.rocks"
license = "MIT"

[dependencies]
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "medl"
path = "src/main.rs"
